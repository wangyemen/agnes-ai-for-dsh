# Agnes AI Tools Plugin for DeepSeek Harness
# Provides image/video generation tools to the DSH agent

- insert:
    # Image Generation Tool
    - id: tool-agnes-image
      name: '@deepseek-ai/agnes-ai-tool-image'

    # Video Generation Tool
    - id: tool-agnes-video
      name: '@deepseek-ai/agnes-ai-tool-video'

    # Main Plugin Package
    - id: agnes-ai-tools
      name: 'agnes-ai-for-dsh'