# Agnes AI Tools Plugin for DeepSeek Harness
# Provides image/video generation and multimodal tools to the DSH agent
#
# This plugin adds TOOLS, not a new LLM provider.
# The agent can use these tools to:
# - Generate images (text-to-image, image-to-image)
# - Generate videos (text-to-video, image-to-video)
# - The existing LLM providers (DeepSeek, etc.) can already handle image understanding

- insert:
    # Image Generation Tool
    - id: tool-agnes-image
      name: '@deepseek-ai/agnes-ai-tool-image'

    # Video Generation Tool
    - id: tool-agnes-video
      name: '@deepseek-ai/agnes-ai-tool-video'

    # Main Plugin Package
    - id: agnes-ai-tools
      name: 'agnes-ai-for-dsh'
